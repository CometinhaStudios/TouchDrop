<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cyber90s Dual</title>
<style>
:root{color-scheme:dark;--bg:#101014;--panel:#1b1b23;--accent:#9b5cff;--text:#f6f3ff;--muted:#b9b3c8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;padding:6px;gap:5px}
header{display:flex;align-items:center;justify-content:space-between;gap:5px;min-height:18px}
.brand{font-size:12px;font-weight:800;letter-spacing:.5px}.slot{color:#c7a6ff}
.status{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:4px;flex-shrink:0}
select,button{min-width:0;border:1px solid #494052;border-radius:6px;background:var(--panel);color:var(--text);font-size:10px;padding:6px 4px}
button.primary{background:var(--accent);border-color:var(--accent);font-weight:bold}
button:active{filter:brightness(1.25)}
#game{flex:1;min-height:0;background:#000;border:1px solid #37313f;border-radius:6px;overflow:hidden;position:relative}
#game canvas{max-width:100%!important;max-height:100%!important;object-fit:contain}
#hint{font-size:9px;color:var(--muted);line-height:1.25;min-height:12px;max-height:28px;overflow:hidden}
#game .emulatorjs{max-width:100%;max-height:100%}
</style>
</head>
<body>
<header><div class="brand">CYBER90S <span class="slot" id="slotLabel">DUAL 1</span></div><div id="controllerStatus" class="status">Controle físico: não vinculado</div></header>
<div class="controls">
  <select id="system" aria-label="Console">
    <option value="snes">Super Nintendo</option>
    <option value="segaMD">Mega Drive</option>
    <option value="nes">Nintendo / NES</option>
    <option value="gba">Game Boy Advance</option>
  </select>
  <button id="chooseRom">Escolher ROM / ZIP</button>
  <button class="primary" id="loadGame">Carregar jogo</button>
  <button id="bindController">Mapear controle físico</button>
</div>
<input id="rom" type="file" accept=".sfc,.smc,.fig,.swc,.md,.gen,.bin,.smd,.nes,.gba,.zip" hidden>
<div id="game"><div style="height:100%;display:grid;place-items:center;color:#9b91aa;font-size:11px;text-align:center;padding:10px">Escolhe o console e uma ROM ou ZIP<br>para iniciar neste lado.</div></div>
<div id="hint">Sem controles virtuais. Usa “Mapear controle físico” para vincular um controle a este lado.</div>
<script>
(function(){
  const slot=Number(new URLSearchParams(location.search).get('slot')||1);
  const system=document.getElementById('system');
  const romInput=document.getElementById('rom');
  const game=document.getElementById('game');
  const hint=document.getElementById('hint');
  const chooseButton=document.getElementById('chooseRom');
  const loadButton=document.getElementById('loadGame');
  let chosenFile=null, loading=false, activeGameUrl=null, loaderScript=null;
  document.getElementById('slotLabel').textContent='DUAL '+slot;
  window.setControllerStatus=function(name){document.getElementById('controllerStatus').textContent='Controle físico: '+name;};
  window.cyberInput=function(key,down){
    const keyName=key==='enter'?'Enter':key==='tab'?'Tab':key;
    const code=key==='enter'?'Enter':key==='tab'?'Tab':key.startsWith('Arrow')?key:key.length===1?'Key'+key.toUpperCase():key;
    const target=game;
    const init={key:keyName,code:code,bubbles:true,cancelable:true,composed:true};
    target.dispatchEvent(new KeyboardEvent(down?'keydown':'keyup',init));
    document.dispatchEvent(new KeyboardEvent(down?'keydown':'keyup',init));
    window.dispatchEvent(new KeyboardEvent(down?'keydown':'keyup',init));
  };
  document.getElementById('chooseRom').addEventListener('click',()=>romInput.click());
  romInput.addEventListener('change',()=>{
    chosenFile=romInput.files&&romInput.files[0]||null;
    hint.textContent=chosenFile?'Selecionado: '+chosenFile.name:'Nenhum arquivo selecionado.';
  });
  document.getElementById('bindController').addEventListener('click',()=>{
    if(window.CyberBridge)window.CyberBridge.bindController();
  });
  function supportedExtensions(core){
    if(core==='snes')return ['.sfc','.smc','.fig','.swc','.bin'];
    if(core==='segaMD')return ['.md','.gen','.smd','.bin'];
    if(core==='nes')return ['.nes'];
    if(core==='gba')return ['.gba'];
    return [];
  }
  function loadScript(src){
    return new Promise((resolve,reject)=>{
      const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Não consegui baixar '+src));document.head.appendChild(s);
    });
  }
  async function prepareRom(file,core){
    const lower=file.name.toLowerCase();
    if(!lower.endsWith('.zip'))return {blob:file,name:file.name};
    hint.textContent='Abrindo ZIP e procurando uma ROM compatível…';
    if(!window.JSZip)await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
    const archive=await window.JSZip.loadAsync(file);
    const allowed=supportedExtensions(core);
    const entries=Object.values(archive.files).filter(entry=>{
      if(entry.dir)return false;
      const name=entry.name.toLowerCase();
      return allowed.some(ext=>name.endsWith(ext));
    }).sort((a,b)=>{
      const score=e=>e.name.split('/').pop().startsWith('__MACOSX/')?1:0;
      return score(a)-score(b)||a.name.length-b.name.length;
    });
    if(!entries.length)throw new Error('Não achei uma ROM compatível dentro do ZIP para o console escolhido.');
    const entry=entries[0];
    hint.textContent='Extraindo '+entry.name.split('/').pop()+' do ZIP…';
    const blob=await entry.async('blob');
    if(!blob.size)throw new Error('A ROM dentro do ZIP está vazia.');
    return {blob:blob,name:entry.name.split('/').pop()};
  }
  loadButton.addEventListener('click',async()=>{
    if(loading)return;
    if(!chosenFile){hint.textContent='Escolhe uma ROM ou ZIP primeiro.';return;}
    loading=true;loadButton.disabled=true;chooseButton.disabled=true;
    try{
      const core=system.value;
      const prepared=await prepareRom(chosenFile,core);
      if(activeGameUrl)URL.revokeObjectURL(activeGameUrl);
      activeGameUrl=URL.createObjectURL(prepared.blob);
      if(loaderScript){loaderScript.remove();loaderScript=null;}
      game.innerHTML='';
      hint.textContent='Carregando motor EmulatorJS e jogo…';
      window.EJS_player='#game';
      window.EJS_core=core;
      window.EJS_gameUrl=activeGameUrl;
      window.EJS_gameName=prepared.name;
      window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
      window.EJS_language='pt-BR';
      window.EJS_startOnLoaded=true;
      window.EJS_gameID='cyber90s-slot-'+slot;
      window.EJS_volume=0.35;
      window.EJS_disableAutoLang=true;
      window.EJS_VirtualGamepadSettings={enabled:false};
      window.EJS_Buttons={playPause:false, restart:false, mute:false, settings:false, fullscreen:false, saveState:false, loadState:false, screenRecord:false, gamepad:false};
      window.EJS_onGameStart=()=>{hint.textContent='Jogo iniciado: '+prepared.name;loading=false;loadButton.disabled=false;chooseButton.disabled=false;};
      window.EJS_onLoadError=(error)=>{hint.textContent='Erro ao carregar o jogo: '+String(error||'ROM ou core incompatível');loading=false;loadButton.disabled=false;chooseButton.disabled=false;};
      window.EJS_defaultControls=slot===1?{
        0:{0:{value:'x',value2:'BUTTON_2'},1:{value:'s',value2:'BUTTON_4'},2:{value:'v',value2:'SELECT'},3:{value:'enter',value2:'START'},4:{value:'up arrow',value2:'DPAD_UP'},5:{value:'down arrow',value2:'DPAD_DOWN'},6:{value:'left arrow',value2:'DPAD_LEFT'},7:{value:'right arrow',value2:'DPAD_RIGHT'},8:{value:'z',value2:'BUTTON_1'},9:{value:'a',value2:'BUTTON_3'},10:{value:'q',value2:'LEFT_TOP_SHOULDER'},11:{value:'e',value2:'RIGHT_TOP_SHOULDER'},12:{value:'tab',value2:'LEFT_BOTTOM_SHOULDER'},13:{value:'r',value2:'RIGHT_BOTTOM_SHOULDER'}},1:{},2:{},3:{}
      }:{
        0:{0:{value:'k',value2:'BUTTON_2'},1:{value:'i',value2:'BUTTON_4'},2:{value:'h',value2:'SELECT'},3:{value:'enter',value2:'START'},4:{value:'w',value2:'DPAD_UP'},5:{value:'s',value2:'DPAD_DOWN'},6:{value:'a',value2:'DPAD_LEFT'},7:{value:'d',value2:'DPAD_RIGHT'},8:{value:'j',value2:'BUTTON_1'},9:{value:'u',value2:'BUTTON_3'},10:{value:'o',value2:'LEFT_TOP_SHOULDER'},11:{value:'p',value2:'RIGHT_TOP_SHOULDER'},12:{value:'y',value2:'LEFT_BOTTOM_SHOULDER'},13:{value:'t',value2:'RIGHT_BOTTOM_SHOULDER'}},1:{},2:{},3:{}
      };
      loaderScript=document.createElement('script');
      loaderScript.src='https://cdn.emulatorjs.org/stable/data/loader.js';
      loaderScript.onerror=()=>{hint.textContent='Falha ao baixar o motor EmulatorJS. Verifica a internet e tenta de novo.';loading=false;loadButton.disabled=false;chooseButton.disabled=false;};
      loaderScript.onload=()=>{setTimeout(()=>{if(loading){hint.textContent='O motor carregou, mas o jogo não iniciou. Confere o formato da ROM e o console selecionado.';loading=false;loadButton.disabled=false;chooseButton.disabled=false;}},15000);};
      document.body.appendChild(loaderScript);
    }catch(error){
      hint.textContent=error&&error.message?error.message:'Falha ao preparar a ROM.';
      loading=false;loadButton.disabled=false;chooseButton.disabled=false;
    }
  });
})();
</script>
</body>
</html>
